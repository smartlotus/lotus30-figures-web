<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>臭猪臭猫｜手办与浮雕冰箱贴 · 3D 展示</title>
<meta name="description" content="Lotus30：猫猫看书 / 小猪敲电脑 立体手办与浮雕冰箱贴。可旋转、拆分看颜色、翻看磁铁槽。" />
<meta name="theme-color" content="#f3f1ec" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F9C6CF'/%3E%3C/svg%3E" />
</head>
<body>
<header class="top">
  <p class="logo">LOTUS<span>30</span></p>
  <button type="button" id="lang" class="lang">EN</button>
</header>
<main>
  <section class="hero">
    <p class="eyebrow" data-i18n="eyebrow">手办 · 冰箱贴 · 原创</p>
    <h1 data-i18n="title">臭猪臭猫</h1>
    <p class="lead" data-i18n="lead">四个完整模型：猫猫看书、小猪敲电脑，各有立体手办与浮雕冰箱贴。拖一拖、拆开看颜色、翻到背面看磁铁槽。</p>
  </section>
  <section class="stage-wrap">
    <div class="stage" id="stage">
      <img class="poster" id="poster" alt="" />
      <div class="viewer-host" id="host"></div>
      <div class="tools">
        <button type="button" id="tSpin" aria-pressed="true" data-i18n="spin">旋转</button>
        <button type="button" id="tExplode" aria-pressed="false" data-i18n="explode">拆分颜色</button>
        <button type="button" id="tFlip" aria-pressed="false" data-i18n="flip" hidden>看背面</button>
        <button type="button" id="tReset" data-i18n="reset">复位</button>
      </div>
      <p class="hint" data-i18n="hint">拖动旋转 · 双指 / 滚轮缩放</p>
      <div class="loading" id="loading"><span></span><i data-i18n="loading">加载模型…</i></div>
    </div>
    <nav class="rail" id="rail"></nav>
    <aside class="detail" id="detail"></aside>
  </section>
  <section class="gallery" id="gallery">
    <h2 data-i18n="renders">效果图</h2>
    <div class="g-grid" id="ggrid"></div>
  </section>
</main>
<footer class="foot">
  <p data-i18n="credit">建模 · lotus · Notion 项目「臭猪臭猫｜手办与浮雕冰箱贴建模完整项目 v1」</p>
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
